name: Bug report
description: Report a reproducible problem with device_preview.
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check that the issue still occurs with the latest package and stable Flutter. Remove sensitive data from logs before posting.
  - type: input
    id: package-version
    attributes:
      label: device_preview version
      placeholder: 3.0.0
    validations:
      required: true
  - type: input
    id: flutter-version
    attributes:
      label: Flutter version
      description: Include the output of `flutter --version`.
      placeholder: 3.47.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform where the issue occurs
      options:
        - Android
        - iOS
        - Web
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Remove tokens, credentials, and personal data.
