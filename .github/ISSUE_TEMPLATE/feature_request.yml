name: Feature request
description: Suggest an improvement to device_preview.
title: "[FEATURE] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what you would like device_preview to do.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Who would benefit, and when?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Alternatives considered, examples, or screenshots.
