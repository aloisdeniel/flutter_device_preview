name: device_preview
description: >-
  A custom WidgetsBinding that simulates device characteristics (screen
  metrics, safe areas, locale, brightness, text scale, accessibility flags,
  target platform) at the engine-abstraction level. No in-app UI — driven
  programmatically and by a DevTools extension.
version: 3.0.0-prerelease7
homepage: https://github.com/aloisdeniel/flutter_device_preview
repository: https://github.com/aloisdeniel/flutter_device_preview
issue_tracker: https://github.com/aloisdeniel/flutter_device_preview/issues
funding:
  - https://www.buymeacoffee.com/aloisdeniel
topics:
  - device-preview
  - responsive
  - devtools
  - testing
  - simulator
screenshots:
  - description: >-
      The todo example running as an iPhone 17 Pro Max — frame, Dynamic
      Island and simulated status bar included.
    path: doc/screenshots/iphone-17-pro-max.png
  - description: >-
      A hinge-aware two-pane layout on the unfolded Pixel 10 Pro Fold, split
      at the simulated crease.
    path: doc/screenshots/pixel-10-pro-fold.png
  - description: >-
      Dark brightness and 200% text scale applied to the device-lab example
      on an iPhone 16 Pro.
    path: doc/screenshots/iphone-16-pro-dark-200-text.png

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # For the VM-service e2e smoke test (test/e2e/), which connects back to the
  # test process's own VM service and exercises the real service-extension
  # glue over the wire.
  vm_service: ^15.0.0
